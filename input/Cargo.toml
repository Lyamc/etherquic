[package]
name = "etherquic-input"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Keyboard, mouse, and gamepad events over etherquic"

[dependencies]
etherquic = { path = ".." }
thiserror = "2"
tokio = { version = "1.28", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }

[[bin]]
name = "etherquic-input-send"
path = "src/bin/send.rs"

[[bin]]
name = "etherquic-input-recv"
path = "src/bin/recv.rs"
