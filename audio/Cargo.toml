[package]
name = "etherquic-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Opus audio over etherquic, framed as LOC objects"
autobins = false

[dependencies]
etherquic = { path = ".." }
etherquic-container = { path = "../container" }
thiserror = "2"
tokio = { version = "1.28", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }

[[bin]]
name = "etherquic-audio-send"
path = "src/bin/send.rs"

[[bin]]
name = "etherquic-audio-recv"
path = "src/bin/recv.rs"
