[package]
name = "etherquic-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "etherquic window. The ui feature is the GPUI front end."
autobins = false

[features]
default = ["ui"]
ui = ["dep:gpui", "dep:etherquic-play", "dep:etherquic-input", "dep:image", "dep:rustls", "dep:rustls-rustcrypto", "dep:rustls-native-certs"]

[dependencies]
etherquic = { path = ".." }
etherquic-play = { path = "../play", default-features = false, optional = true }
etherquic-input = { path = "../input", optional = true }
qrcode = { version = "0.14", default-features = false }
# Discovery thumbnails are JPEG XL. Pure Rust, reads a cut-short progressive stream.
jxl-oxide = { version = "0.12", default-features = false }
# GPUI's own image type for the decoded thumbnail.
image = { version = "0.25.1", default-features = false, optional = true }
tokio = { version = "1.28", features = ["rt", "macros", "sync", "time"] }
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-rustcrypto = { path = "../vendor/rustls-rustcrypto", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

# Desktop play (capture, winit picture window) is not built for the phone.
[target.'cfg(not(target_os = "android"))'.dependencies]
etherquic-play = { path = "../play", default-features = false, optional = true, features = ["desktop"] }

# The Windows backend is built in. Linux needs a window system, and this machine is Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true, features = ["wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true }

# macOS draws text through font-kit; without it GPUI uses a text system that
# draws nothing. Runtime shaders build without Xcode's separate Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
resvg = "0.45"
tiny-skia = "0.11"

[[bin]]
name = "etherquic"
path = "src/main.rs"
required-features = ["ui"]
