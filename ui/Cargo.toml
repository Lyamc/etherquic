[package]
name = "etherquic-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "etherquic window. The ui feature is the GPUI front end."
autobins = false

[features]
default = ["ui"]
ui = ["dep:gpui", "dep:etherquic-play", "etherquic-play/desktop", "dep:image"]

[dependencies]
etherquic = { path = ".." }
etherquic-play = { path = "../play", default-features = false, optional = true }
qrcode = { version = "0.14", default-features = false }
# Discovery thumbnails are JPEG XL. Pure Rust, reads a cut-short progressive stream.
jxl-oxide = { version = "0.12", default-features = false }
# GPUI's own image type for the decoded thumbnail.
image = { version = "0.25.1", default-features = false, optional = true }
tokio = { version = "1.28", features = ["rt", "macros", "sync", "time"] }
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true }

# The Windows backend is built in. Linux needs a window system, and this machine is Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { path = "../../../interfaces/gpui", default-features = false, optional = true, features = ["wayland"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "etherquic"
path = "src/main.rs"
required-features = ["ui"]

# The published gpui_http_client 0.2.2 has no install_tls_provider. The Lyamc
# GPUI fork calls it from Application::new. Use the sibling crate that installs
# Graviola instead of ring.
[patch.crates-io]
gpui_http_client = { path = "../../../interfaces/gpui_http_client" }
# xattr 0.2.3 reads libc::ENOATTR, which this libc no longer defines.
# On Linux that value is ENODATA.
xattr = { path = "../vendor/xattr" }
