<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 128×128 crop of a 1280×720 desktop: default start menu + taskbar.
       Pins are stock apps only (Explorer, Firefox, Settings, Edge). -->
  <!-- Desktop wallpaper peeking at the right. -->
  <rect width="128" height="128" fill="#3A6EA5"/>
  <circle cx="118" cy="18" r="22" fill="#F4D35E" opacity="0.85"/>
  <circle cx="118" cy="18" r="14" fill="#F8E7A0"/>

  <!-- Start menu body. -->
  <rect x="2" y="4" width="110" height="96" rx="10" fill="#2B2B2B"/>
  <rect x="2" y="4" width="110" height="96" rx="10" fill="#1A1A1A" opacity="0.35"/>

  <!-- Search field. -->
  <rect x="10" y="12" width="94" height="18" rx="9" fill="#3A3A3A"/>
  <circle cx="20" cy="21" r="4.2" fill="none" stroke="#C8C8C8" stroke-width="1.6"/>
  <line x1="23.2" y1="24.2" x2="26.4" y2="27.2" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Fake "Search" glyphs so we do not depend on a font. -->
  <rect x="32" y="19" width="22" height="3.2" rx="1.2" fill="#B0B0B0"/>
  <rect x="56" y="19" width="14" height="3.2" rx="1.2" fill="#B0B0B0"/>
  <rect x="32" y="24.5" width="8" height="2.2" rx="1" fill="#7A7A7A"/>

  <!-- Pinned row label. -->
  <rect x="12" y="38" width="20" height="3" rx="1" fill="#9A9A9A"/>

  <!-- File Explorer -->
  <g transform="translate(12,46)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <path d="M4 9 h6 l2 2 h10 v9 h-18 z" fill="#E8B931"/>
    <path d="M4 12 h18 v8 h-18 z" fill="#F5D76E"/>
  </g>
  <!-- Firefox (generic orange fox, not a trademark lockup) -->
  <g transform="translate(42,46)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <circle cx="12" cy="13" r="8" fill="#FF7139"/>
    <path d="M5 14 C8 6 16 6 19 12 C16 9 10 9 7 14 Z" fill="#FFB38A"/>
    <circle cx="14.5" cy="12.5" r="2.2" fill="#1C3A6B"/>
    <circle cx="14.5" cy="12.5" r="0.9" fill="#F4F7FF"/>
  </g>
  <!-- Settings -->
  <g transform="translate(72,46)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <circle cx="12" cy="12" r="7" fill="none" stroke="#C5C5C5" stroke-width="3"/>
    <circle cx="12" cy="12" r="3" fill="#2B2B2B" stroke="#C5C5C5" stroke-width="1.4"/>
    <rect x="11" y="3" width="2" height="3.2" fill="#C5C5C5"/>
    <rect x="11" y="17.8" width="2" height="3.2" fill="#C5C5C5"/>
    <rect x="3" y="11" width="3.2" height="2" fill="#C5C5C5"/>
    <rect x="17.8" y="11" width="3.2" height="2" fill="#C5C5C5"/>
  </g>

  <!-- Edge-like -->
  <g transform="translate(12,76)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <circle cx="12" cy="13" r="8" fill="#0078D4"/>
    <path d="M5 14 h14 c-1 5 -13 5 -14 0 z" fill="#32D4A4"/>
    <path d="M6 12 h12" stroke="#F4F7FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Store-like -->
  <g transform="translate(42,76)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <rect x="6" y="9" width="12" height="10" rx="1.5" fill="#7B5CFF"/>
    <path d="M8 9 C8 6 16 6 16 9" fill="none" stroke="#D7CCFF" stroke-width="1.6"/>
  </g>
  <!-- Mail -->
  <g transform="translate(72,76)">
    <rect width="24" height="24" rx="6" fill="#1E1E1E"/>
    <rect x="5" y="8" width="14" height="10" rx="1.5" fill="#2B88D8"/>
    <path d="M5 8 L12 14 L19 8" fill="none" stroke="#F4F7FF" stroke-width="1.4"/>
  </g>

  <!-- Taskbar -->
  <rect x="0" y="104" width="128" height="24" fill="#1C1C1C"/>
  <!-- Start -->
  <rect x="6" y="108" width="16" height="16" rx="3" fill="#2A2A2A"/>
  <rect x="8" y="110" width="5.2" height="5.2" fill="#F2F2F2"/>
  <rect x="14.6" y="110" width="5.2" height="5.2" fill="#F2F2F2"/>
  <rect x="8" y="116.4" width="5.2" height="5.2" fill="#F2F2F2"/>
  <rect x="14.6" y="116.4" width="5.2" height="5.2" fill="#F2F2F2"/>
  <!-- Taskbar search -->
  <rect x="26" y="109" width="36" height="14" rx="7" fill="#2F2F2F"/>
  <circle cx="34" cy="116" r="3.2" fill="none" stroke="#B8B8B8" stroke-width="1.3"/>
  <line x1="36.4" y1="118.4" x2="39" y2="120.8" stroke="#B8B8B8" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Explorer on the bar -->
  <rect x="66" y="109" width="14" height="14" rx="3" fill="#2A2A2A"/>
  <path d="M68 113 h3 l1 1 h6 v6 h-10 z" fill="#E8B931"/>
  <!-- Firefox on the bar -->
  <rect x="84" y="109" width="14" height="14" rx="3" fill="#2A2A2A"/>
  <circle cx="91" cy="116" r="4.6" fill="#FF7139"/>
  <circle cx="92.4" cy="115.4" r="1.3" fill="#1C3A6B"/>
  <!-- Settings on the bar -->
  <rect x="102" y="109" width="14" height="14" rx="3" fill="#2A2A2A"/>
  <circle cx="109" cy="116" r="3.6" fill="none" stroke="#C5C5C5" stroke-width="1.6"/>
  <circle cx="109" cy="116" r="1.3" fill="#1C1C1C"/>
</svg>
