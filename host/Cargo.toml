[package]
name = "etherquic-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Headless etherquic host that runs as a Windows service"
autobins = false

[dependencies]
etherquic = { path = ".." }
etherquic-input = { path = "../input" }
jpeg-encoder = "0.6"
quinn = { path = "../vendor/quinn/quinn", default-features = false, features = [
    "runtime-tokio",
    "rustls-pure",
] }
zune-jpeg = "0.4"
tokio = { version = "1.28", features = ["rt", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "audioclient",
    "audiosessiontypes",
    "combaseapi",
    "d3d11",
    "d3dcommon",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "errhandlingapi",
    "minwinbase",
    "mmdeviceapi",
    "oaidl",
    "objidl",
    "objidlbase",
    "propidl",
    "propkeydef",
    "processthreadsapi",
    "propsys",
    "strmif",
    "unknwnbase",
    "wingdi",
    "winbase",
    "winnt",
    "winuser",
] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "etherquic-host"
path = "src/main.rs"
