[package]
name = "etherquic-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Unattended installer for the etherquic Windows host service"
autobins = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
] }

[[bin]]
name = "etherquic-setup"
path = "src/main.rs"
