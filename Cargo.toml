[workspace]
resolver = "2"
members = [
    "ui",
    "play",
    "host",
    "setup",
    "media",
    "audio",
    "video",
    "input",
    "container",
    "packaging",
    "android",
    "avb",
    "st2110",
    "fresh-consumer",
]
# The root package is this manifest. Listing "." would mark every path under
# it as an explicit member, and then exclude cannot keep vendor/quinn out.
default-members = ["."]
exclude = [
    "vendor/quinn",
    "vendor/rustls-rustcrypto",
    "vendor/rustls-rustcrypto/examples-xsmall",
    "vendor/rustls-rustcrypto/validation/consumer-no_std",
    "vendor/softbuffer",
    "vendor/xattr",
    "vendor/blade-graphics",
]

# The published gpui_http_client 0.2.2 has no install_tls_provider. The Lyamc
# GPUI fork calls it from Application::new. Use the sibling crate that installs
# Graviola instead of ring.
[patch.crates-io]
gpui_http_client = { path = "../../interfaces/gpui_http_client" }
# xattr 0.2.3 reads libc::ENOATTR, which this libc no longer defines.
# On Linux that value is ENODATA.
xattr = { path = "vendor/xattr" }
# Adreno 640 (Vulkan 1.1) has no dynamic rendering / timeline semaphores.
# Blade draws through GLES on Android instead.
blade-graphics = { path = "vendor/blade-graphics" }

[package]
name = "etherquic"
version = "0.1.14"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "QUIC over a pure-Rust Ethernet datagram backend (Quinn + rustls-rustcrypto)"
publish = false

[target.'cfg(not(target_os = "android"))'.dependencies]
pcap = "2.2"
# Look compute: ordered / poster / blocks. CPU LUT is the fallback.
wgpu = { version = "24.0.3", features = ["wgsl"] }
pollster = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
avb = { path = "avb" }
st2110 = { path = "st2110" }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
bytes = "1"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
quinn = { path = "vendor/quinn/quinn", default-features = false, features = [
    "runtime-tokio",
    "rustls-pure",
    "bloom",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-rustcrypto = { path = "vendor/rustls-rustcrypto" }
# The IPv6 play listener is IPv6-only, so IPv4 has a socket of its own.
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1.28", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }

[[bin]]
name = "etherquic-demo"
path = "src/bin/demo.rs"

[profile.release]
debug = true

[[example]]
name = "l2_ping"
path = "examples/l2_ping.rs"
