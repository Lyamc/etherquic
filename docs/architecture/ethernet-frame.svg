<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Ethernet frame layout</title>
  <desc id="desc">Fourteen byte Ethernet header, six byte service header, QUIC datagram, then NIC padding that payload_len excludes.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1c1917; }
    .h { font-size: 22px; font-weight: 700; }
    .f { font-size: 13px; font-weight: 700; }
    .n { font-size: 12px; fill: #44403c; }
    .box { stroke: #1c1917; stroke-width: 1.4; }
  </style>
  <rect width="980" height="520" fill="#f7f5f0"/>
  <text class="h" x="32" y="40">Ethernet frame</text>
  <text class="n" x="32" y="64">Big-endian. The NIC may pad the buffer to 60 bytes. The FCS is not in this buffer.</text>

  <g transform="translate(32,92)">
    <rect class="box" x="0" y="0" width="120" height="78" fill="#dbe7f5"/>
    <rect class="box" x="120" y="0" width="120" height="78" fill="#dbe7f5"/>
    <rect class="box" x="240" y="0" width="88" height="78" fill="#c5d7ee"/>
    <rect class="box" x="328" y="0" width="100" height="78" fill="#f6e6d0"/>
    <rect class="box" x="428" y="0" width="100" height="78" fill="#f6e6d0"/>
    <rect class="box" x="528" y="0" width="88" height="78" fill="#f3d7b0"/>
    <rect class="box" x="616" y="0" width="220" height="78" fill="#d7efe4"/>
    <rect class="box" x="836" y="0" width="96" height="78" fill="#e7e5e4" stroke-dasharray="4 3"/>

    <text class="f" x="60" y="32" text-anchor="middle">dst MAC</text>
    <text class="n" x="60" y="54" text-anchor="middle">6</text>
    <text class="f" x="180" y="32" text-anchor="middle">src MAC</text>
    <text class="n" x="180" y="54" text-anchor="middle">6</text>
    <text class="f" x="284" y="28" text-anchor="middle">EtherType</text>
    <text class="n" x="284" y="50" text-anchor="middle">0x88B6</text>
    <text class="n" x="284" y="66" text-anchor="middle">2</text>
    <text class="f" x="378" y="28" text-anchor="middle">dst service</text>
    <text class="n" x="378" y="50" text-anchor="middle">2</text>
    <text class="f" x="478" y="28" text-anchor="middle">src service</text>
    <text class="n" x="478" y="50" text-anchor="middle">2</text>
    <text class="f" x="572" y="28" text-anchor="middle">payload len</text>
    <text class="n" x="572" y="50" text-anchor="middle">2</text>
    <text class="f" x="726" y="32" text-anchor="middle">QUIC datagram</text>
    <text class="n" x="726" y="54" text-anchor="middle">payload_len bytes</text>
    <text class="f" x="884" y="32" text-anchor="middle">pad</text>
    <text class="n" x="884" y="54" text-anchor="middle">ignored</text>
  </g>

  <text class="n" x="32" y="196">Ethernet header, 14 bytes</text>
  <text class="n" x="360" y="196">Service header, 6 bytes. Counts toward the interface MTU.</text>
  <text class="n" x="32" y="220">A 1500-byte MTU leaves 1494 bytes for the QUIC datagram.</text>

  <path d="M592 92 v-16 h210" fill="none" stroke="#7c4a12" stroke-width="1.4"/>
  <text class="n" x="640" y="68">payload_len covers only the datagram</text>

  <text class="h" x="32" y="268" style="font-size:18px">Who the service field selects</text>
  <g transform="translate(32,288)" font-size="14">
    <rect class="box" x="0" y="0" width="220" height="56" rx="8" fill="#f6e6d0"/>
    <text class="f" x="16" y="24">4433 play</text>
    <text class="n" x="16" y="44">desktop, or one video file</text>
    <rect class="box" x="236" y="0" width="220" height="56" rx="8" fill="#f6e6d0"/>
    <text class="f" x="252" y="24">4434 audio</text>
    <text class="n" x="252" y="44">standalone audio tool</text>
    <rect class="box" x="472" y="0" width="220" height="56" rx="8" fill="#f6e6d0"/>
    <text class="f" x="488" y="24">4435 input</text>
    <text class="n" x="488" y="44">standalone input tool</text>
    <rect class="box" x="708" y="0" width="220" height="56" rx="8" fill="#e7efd4"/>
    <text class="f" x="724" y="24">4440 discovery</text>
    <text class="n" x="724" y="44">not a QUIC socket</text>
  </g>

  <text class="n" x="32" y="390">A desktop session uses 4433 only. Picture, audio, and input are QUIC streams on that one connection.</text>
  <text class="n" x="32" y="414">Quinn stores the peer as a fe80::/64 address. The interface id is the MAC in EUI-64 form, and the port is the service.</text>
  <text class="n" x="32" y="438">That address is a path key inside the process. It is not written into the frame.</text>
  <text class="n" x="32" y="478">Short QUIC ACKs are smaller than the 60-byte Ethernet minimum. Without payload_len, the pad would be</text>
  <text class="n" x="32" y="500">read as part of the ciphertext and AEAD would fail.</text>
</svg>
